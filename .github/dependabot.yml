# The workflows pin each action to a commit (a tag can be moved to other
# code; a commit can't). Dependabot keeps those pins up to date: one pull
# request a month with every action's new version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
