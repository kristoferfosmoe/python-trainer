# Tests on every push and pull request. Python Trainer is retired, so nothing
# is pushed or deployed any more (see docs/TEARDOWN.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator and lessons (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 matches Pyodide in the browser; 3.11 is the oldest supported.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run tests (includes checking every lesson in content/)
        working-directory: sim
        run: uv run --python ${{ matrix.python }} pytest -q

  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trainer" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run pytest -q

  frontend:
    name: Web app and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck, unit tests and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Browser tests (real Pyodide in Chromium, real Django backend)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the web and caddy images
        run: |
          docker build -f deploy/Dockerfile --target web -t python-trainer-web .
          docker build -f deploy/Dockerfile --target caddy -t python-trainer-caddy .

