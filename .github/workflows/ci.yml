# Tests on every push and pull request. On a merge to main, once everything
# passes, the images are pushed to the registry and deployed (deploy.yml).
# Deploying is off until the repository variable DEPLOY_TO_AWS is "true"
# (see docs/DEPLOY.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # run it on main by hand for the first deploy

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator and lessons (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 matches Pyodide in the browser; 3.11 is the oldest supported.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Run tests (includes checking every lesson in content/)
        working-directory: sim
        run: uv run --python ${{ matrix.python }} pytest -q

  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trainer" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run pytest -q

  frontend:
    name: Web app and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck, unit tests and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Browser tests (real Pyodide in Chromium, real Django backend)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the web and caddy images
        run: |
          docker build -f deploy/Dockerfile --target web -t python-trainer-web .
          docker build -f deploy/Dockerfile --target caddy -t python-trainer-caddy .

  publish:
    name: Push images to the registry
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_AWS == 'true'
    needs: [simulator, backend, frontend, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign in to AWS
    steps:
      - uses: actions/checkout@v5
      - name: Show who GitHub says this job is (AWS checks this)
        continue-on-error: true
        run: python3 deploy/aws/github-identity.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the web and caddy images for this commit
        env:
          IMAGE_REPO: ${{ vars.IMAGE_REPO }}
          VERSION: ${{ github.sha }}
        run: |
          IMAGE_REPO=${IMAGE_REPO//[[:space:]]/} # stray spaces from pasting
          for target in web caddy; do
            image="$IMAGE_REPO/$target:$VERSION"
            # Tags can't be overwritten, so a re-run skips images already pushed.
            if aws ecr describe-images --repository-name "${IMAGE_REPO#*/}/$target" \
                --image-ids imageTag="$VERSION" > /dev/null 2>&1; then
              echo "$image is already in the registry"
              continue
            fi
            docker build -f deploy/Dockerfile --target "$target" --build-arg APP_VERSION="$VERSION" -t "$image" .
            docker push "$image"
          done

  deploy:
    name: Deploy
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.sha }}
