name: CI

on:
  push:
  pull_request:

jobs:
  simulator:
    name: Simulator (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 matches Pyodide in the browser; 3.11 is the oldest supported.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Run tests (includes every challenge solution in content/)
        working-directory: sim
        run: uv run --python ${{ matrix.python }} pytest -q

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck, unit tests and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Browser tests (real Pyodide in Chromium)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"
