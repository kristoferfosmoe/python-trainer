id: the-gyro
title: The Gyro
summary: Know exactly which way the robot is pointing, even when the wheels slip.
concepts: [gyro, heading, sensor loops]
blocks:
  - type: text
    markdown: |
      Inside the hub is a **gyro** sensor. It feels the robot turning and
      keeps track of which way it's pointing:

      ```python
      hub = PrimeHub()
      print(hub.imu.heading())    # degrees turned since the start
      hub.imu.reset_heading(0)    # call the current direction 0
      ```

      Turning right makes the heading go **up**, and turning left makes it
      go **down**.

      Why does it matter? `drive_base.turn(90)` works by counting how far the
      **wheels** turned. If the wheels **slip** on the mat, the robot turns
      less than 90 degrees, but the gyro still knows the truth.

  - type: quiz
    id: heading-after
    question: The heading starts at 0. The robot does `turn(90)`, then `turn(90)`, then `turn(-45)`. What does `hub.imu.heading()` say (with no slipping)?
    choices: ["45", "135", "225", "-45"]
    answer: 1
    explain: 90 + 90 − 45 = 135.

  - type: text
    markdown: |
      ## A gyro turn

      Instead of `turn()`, start spinning and **watch the gyro** until you've
      turned far enough:

      ```python
      def gyro_turn(angle):
          target = hub.imu.heading() + angle
          drive_base.drive(0, 90)             # spin right at 90°/s
          while hub.imu.heading() < target:
              wait(5)
          drive_base.brake()                  # brake: stop spinning quickly
      ```

      `brake()` stops faster than `stop()`, which lets the robot coast.

      ⚠️ If the robot bumps into something while turning, the heading never
      reaches `target` and this loop never ends! Keep turns away from walls.

  - type: challenge
    id: slippery-square
    title: Slippery Square
    summary: The wheels slip. Use the gyro to drive a square anyway.
    world: squares
    realism: {slip: 0.07}
    time_limit: 60
    instructions: |
      Today the mat is **slippery**. Run the starter code: the square comes
      out crooked, because every `turn(90)` turns a bit less than 90°.

      Write a `gyro_turn` function (like the one above) and use it instead of
      `turn()`, so the robot drives the big square through the yellow dots
      and back to the start.
    goals:
      - {type: visit_zones, zones: [big-1, big-2, big-3, start-corner], in_order: true}
      - {type: end_in_zone, zone: start-corner}
      - {type: max_calls, name: turn, value: 0}
      - {type: must_use, construct: def}
    hints:
      - "Copy the `gyro_turn` function from above and put it before the loop."
      - "In the loop: `drive_base.straight(400)` then `gyro_turn(90)`."
    starter: |
      from pybricks.hubs import PrimeHub
      from pybricks.pupdevices import Motor
      from pybricks.parameters import Port, Direction
      from pybricks.robotics import DriveBase
      from pybricks.tools import wait

      hub = PrimeHub()
      left_motor = Motor(Port.A, Direction.COUNTERCLOCKWISE)
      right_motor = Motor(Port.B)
      drive_base = DriveBase(left_motor, right_motor, wheel_diameter=56, axle_track=112)

      for side in range(4):
          drive_base.straight(400)
          drive_base.turn(90)
          print("Heading:", hub.imu.heading())
    solution: |
      from pybricks.hubs import PrimeHub
      from pybricks.pupdevices import Motor
      from pybricks.parameters import Port, Direction
      from pybricks.robotics import DriveBase
      from pybricks.tools import wait

      hub = PrimeHub()
      left_motor = Motor(Port.A, Direction.COUNTERCLOCKWISE)
      right_motor = Motor(Port.B)
      drive_base = DriveBase(left_motor, right_motor, wheel_diameter=56, axle_track=112)

      def gyro_turn(angle):
          target = hub.imu.heading() + angle
          drive_base.drive(0, 90)
          while hub.imu.heading() < target:
              wait(5)
          drive_base.brake()
          wait(200)

      for side in range(4):
          drive_base.straight(400)
          gyro_turn(90)
