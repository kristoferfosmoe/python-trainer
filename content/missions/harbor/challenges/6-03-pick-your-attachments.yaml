id: pick-your-attachments
title: Pick Your Attachments
tier: 6
summary: Three runs, and you choose the attachment for each one. Score as much as you can.
runs:
  - start: {x: 200, y: 330, heading: 0}
    choose: {E: [forklift, pusher]}
  - start: {x: 200, y: 520, heading: 0}
    choose: {E: [forklift, pusher]}
  - start: {x: 200, y: 700, heading: 0}
    choose: {E: [forklift, pusher]}
    attachments: {F: sweeper}
solution_attachments: [{E: pusher}, {E: forklift}, {E: forklift}]
models: [crate, bell, sample, buoy, flag]
time_limit: 150
stars: [100, 125, 145]
instructions: |
  Now it's your plan. You have **three runs** and **2:30**. Five missions
  are on the field (not the top lane yet): the crate, the bell, the sample,
  the buoy and the flag.

  Pick the attachment for each run on the cards above the code. Run 3 also
  gets the sweeper on F. Think about which attachment fits which missions:
  the **forklift** reaches 240 mm ahead and has a hook, and the **pusher**
  only sticks out 10 mm (so the robot's own numbers work).

  Stars: ⭐ 100 points, ⭐⭐ 125, ⭐⭐⭐ 145. Precision tokens count too: come
  back to Home after every run!
goals: []
hints:
  - "Run 1 can do the crate *and* the bell: after the crate, back into Home, turn, move 180 mm over to the bell's lane, and turn back."
  - "An attachment that goes on between runs starts wherever its motor left off. Reset its angle at the start of the run: `sweeper.reset_angle(90)` (the sweeper goes on folded)."
  - "The pusher is 10 mm long: with it, driving 800 mm puts the crate on the dock. With the forklift, the crate ends up 230 mm further."
