solution: |
  from pybricks.hubs import PrimeHub
  from pybricks.pupdevices import Motor
  from pybricks.parameters import Port, Direction, Button
  from pybricks.robotics import DriveBase
  from pybricks.tools import wait

  hub = PrimeHub()
  hub.system.set_stop_button(Button.BLUETOOTH)
  left_motor = Motor(Port.A, Direction.COUNTERCLOCKWISE)
  right_motor = Motor(Port.B)
  drive_base = DriveBase(left_motor, right_motor, wheel_diameter=56, axle_track=112)
  arm = Motor(Port.E)
  sweeper = Motor(Port.F)


  def crate_and_bell():
      # Pusher on E: it sticks out 10 mm past the front.
      drive_base.straight(800)          # crate onto the dock
      drive_base.straight(-800)
      drive_base.turn(90)               # face down the table
      drive_base.straight(180)          # to the bell's lane
      drive_base.turn(-90)
      drive_base.straight(990)          # ring once...
      drive_base.straight(-100)
      drive_base.straight(100)          # ...and twice
      drive_base.straight(-990)


  def sample():
      arm.reset_angle(0)
      drive_base.straight(560)
      arm.run_target(300, 45)
      drive_base.straight(-600)


  def buoy_and_flag():
      arm.reset_angle(0)
      sweeper.reset_angle(90)           # the sweeper went on folded, but its motor didn't know
      drive_base.straight(670)
      sweeper.run_target(300, 0)
      drive_base.straight(200)
      sweeper.run_target(300, 90)
      drive_base.straight(290)
      arm.run_target(300, 60)
      arm.run_target(300, 0)
      drive_base.straight(-1160)


  for run in [crate_and_bell, sample, buoy_and_flag]:
      while Button.CENTER not in hub.buttons.pressed():
          wait(10)
      run()
