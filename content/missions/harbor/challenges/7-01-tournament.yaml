instructions: |
  This is it: **every mission**, **four runs**, **2:30**, and real-world
  wobble. Like at a real tournament, your program has to work **every
  time**: it runs **3 times**, and a star only counts if you reach it on
  all 3.

  Run 4 starts facing **up**, for the top lane (the lighthouse, the gate and
  the barrel).

  Everything you've learned counts: the gyro, resetting motors between runs,
  coming back to Home, and choosing attachments.

  Stars: ⭐ 140 points, ⭐⭐ 170, ⭐⭐⭐ 200 (the most is 205).
goals: []
hints:
  - "Start from your *Pick Your Attachments* program, and add `drive_base.use_gyro(True)`."
  - "In the top lane the forklift would hit the lighthouse lever: lift it up out of the way first (`arm.run_target(300, 80)`)."
  - "After the barrel, drive straight back, turn, and back up into Home, so you keep your precision tokens."
