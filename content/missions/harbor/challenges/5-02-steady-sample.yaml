id: steady-sample
title: Steady Hands
tier: 5
summary: The sample's ring is small. Bring it home 3 times out of 3, with wobble on.
runs:
  - start: {x: 200, y: 520, heading: 0}
    attachments: {E: forklift}
models: [sample]
time_limit: 30
realism: "on"
seeds: [1, 2, 3]
instructions: |
  The sample's ring is only **50 mm** across, so the hook has to arrive
  right in the middle. With real-world wobble on, a robot that drifts just
  a little misses it.

  Bring the sample home on **all 3 tries**.
goals:
  - {type: mission_done, mission: M03, points: 30}
hints:
  - "The gyro keeps the robot on its line: `drive_base.use_gyro(True)`."
starter: |
  from pybricks.hubs import PrimeHub
  from pybricks.pupdevices import Motor
  from pybricks.parameters import Port, Direction
  from pybricks.robotics import DriveBase

  hub = PrimeHub()
  left_motor = Motor(Port.A, Direction.COUNTERCLOCKWISE)
  right_motor = Motor(Port.B)
  drive_base = DriveBase(left_motor, right_motor, wheel_diameter=56, axle_track=112)
  arm = Motor(Port.E)

  drive_base.straight(560)
  arm.run_target(300, 45)
  drive_base.straight(-600)
solution: |
  from pybricks.hubs import PrimeHub
  from pybricks.pupdevices import Motor
  from pybricks.parameters import Port, Direction
  from pybricks.robotics import DriveBase

  hub = PrimeHub()
  left_motor = Motor(Port.A, Direction.COUNTERCLOCKWISE)
  right_motor = Motor(Port.B)
  drive_base = DriveBase(left_motor, right_motor, wheel_diameter=56, axle_track=112)
  arm = Motor(Port.E)
  drive_base.use_gyro(True)

  drive_base.straight(560)
  arm.run_target(300, 45)
  drive_base.straight(-600)
