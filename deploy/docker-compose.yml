# Production. Settings come from deploy/.env (copy deploy/.env.example).
#
# With the CD pipeline, CI builds the images and deploy/deploy.sh runs a
# given version: IMAGE_REPO/web:IMAGE_TAG and IMAGE_REPO/caddy:IMAGE_TAG.
# Without it, build on the server instead:
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer} -d ${POSTGRES_DB:-trainer}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${IMAGE_REPO:-python-trainer}/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      POSTGRES_HOST: db
      LESSON_CHECKER_SOCKET: /run/checker/checker.sock
    volumes:
      - checker_socket:/run/checker
    depends_on:
      db:
        condition: service_healthy
      checker:
        condition: service_started

  # Runs the code in lessons saved in the admin, to check them. That code is
  # real Python, so it runs here, walled off: no network (so no database),
  # no secrets (no env_file), a read-only disk, and limits on memory and
  # processes. Django reaches it through a socket in a shared volume.
  checker:
    image: ${IMAGE_REPO:-python-trainer}/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    command: ["python", "-m", "trainer_content.server", "/run/checker/checker.sock"]
    environment:
      PYTHONPATH: /app/sim/src
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 1g
    volumes:
      - checker_socket:/run/checker
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/run/checker/checker.sock')"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  caddy:
    image: ${IMAGE_REPO:-python-trainer}/caddy:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: caddy
    restart: unless-stopped
    environment:
      # No domain: plain HTTP on port 80 for any address (see deploy/set-address.sh).
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  checker_socket:
  caddy_data:
  caddy_config:
